<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>truma-x</title>
<meta name="theme-color" content="#0c1c3e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="truma-x">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1c3e;--surface:#15294e;--surface2:#1d3866;--line:#2b4576;
    --fg:#eef3fb;--muted:#9fb2d0;--accent:#3b9bf0;--accent-soft:#3b9bf033;--r:16px;
    font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  html{touch-action:manipulation;-webkit-text-size-adjust:100%}
  button,.toggle,.pill{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(120% 80% at 50% -10%,#16386a 0%,var(--bg) 60%) fixed,var(--bg);
    color:var(--fg);min-height:100dvh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    padding:max(14px,env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
  .wrap{max-width:460px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:.6rem;
    background:#fff;color:#0c1c3e;border-radius:12px;padding:11px 14px;margin:0 0 16px;box-shadow:0 3px 12px #0004}
  .brand{display:flex;align-items:center;gap:9px;font-family:"Space Grotesk";font-weight:600;letter-spacing:.01em;font-size:1.05rem}
  .brand .logo{width:18px;height:18px;color:#2f6df0;flex:none}
  .brand small{color:#5b6a86;font-family:"Inter";font-weight:500}
  .right{display:flex;align-items:center;gap:12px}
  .status{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:#5b6a86}
  .dot{width:8px;height:8px;border-radius:50%;background:#9fb0cc}
  .status.ok .dot{background:#2bb673;box-shadow:0 0 0 4px #2bb67322}
  .status.mock .dot{background:#f0a022;box-shadow:0 0 0 4px #f0a02222}
  .status.bad .dot{background:#e23b3b}
  .iconbtn{background:none;border:none;color:#33507e;cursor:pointer;padding:4px;display:grid;place-items:center}
  .iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}

  .dial{position:relative;width:280px;height:280px;margin:6px auto 8px;touch-action:none;user-select:none}
  .dial svg{width:100%;height:100%;display:block}
  .track{fill:none;stroke:var(--line);stroke-width:14;stroke-linecap:round}
  .value{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke .5s ease,stroke-dasharray .35s cubic-bezier(.4,0,.2,1)}
  .knob{fill:var(--fg);stroke:var(--accent);stroke-width:3;transition:stroke .5s ease}
  .curmark{fill:var(--bg,#0b1b3a);stroke:var(--fg);stroke-width:3;opacity:.9;transition:cx .35s ease,cy .35s ease}
  .dial.small{width:220px;height:220px}
  .dial.small .temp{font-size:3.2rem}
  .dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .temp{font-family:"Space Grotesk";font-weight:600;font-size:4.1rem;line-height:.9;letter-spacing:-.02em}
  .temp sup{font-size:1.3rem;font-weight:500;top:-1.4rem;color:var(--muted);margin-left:2px}
  .mode-name{color:var(--accent);font-weight:600;font-size:.95rem;transition:color .5s ease}
  .cur{color:var(--muted);font-size:.82rem;margin-top:2px}
  .stepper{display:flex;justify-content:center;gap:44px;margin:-6px 0 22px}
  .stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1.5rem;line-height:1;cursor:pointer;display:grid;place-items:center}
  .stepper button{-webkit-user-select:none;user-select:none}
  .stepper button:active{background:var(--surface2);transform:scale(.94)}
  .stepper button:disabled{opacity:.35;cursor:default}

  .modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:22px}
  .mode{min-height:66px;border:1px solid var(--line);background:var(--surface);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--muted);transition:.18s;padding:8px 4px}
  .mode svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
  .mode span{font-size:.66rem;text-align:center;line-height:1.05;word-break:break-word}
  .mode[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  .card h3{margin:0 0 12px;font-size:.82rem;font-weight:600;color:var(--muted)}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1;min-width:60px;padding:11px 4px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-size:.82rem;cursor:pointer;transition:.15s}
  .seg button[aria-pressed="true"]{color:#0b1017;background:var(--accent);border-color:var(--accent);font-weight:600}
  .subrow{margin-bottom:16px}
  .subrow:last-child{margin-bottom:0}
  .subrow>label{display:block;font-size:.74rem;color:var(--muted);margin-bottom:8px}
  .lightrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .toggle{width:52px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);position:relative;cursor:pointer;transition:.2s}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
  .toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
  .toggle[aria-pressed="true"]::after{left:25px;background:#0b1017}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;background:var(--surface2);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--surface)}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--surface)}

  details.all{margin-top:6px}
  details.all>summary{list-style:none;cursor:pointer;color:var(--muted);font-size:.82rem;padding:12px 4px;display:flex;align-items:center;gap:8px}
  details.all>summary::-webkit-details-marker{display:none}
  details.all>summary .chev{transition:.2s;margin-left:auto}
  details.all[open]>summary .chev{transform:rotate(180deg)}
  .devname{color:var(--muted);font-size:.68rem;letter-spacing:.04em;margin:14px 2px 6px}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:none}
  .prow .k{font-size:.85rem}
  .prow .k small{display:block;color:var(--muted);font-size:.72rem;margin-top:3px}
  .prow select,.prow input[type=number]{background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:.85rem;max-width:150px}
  .prow .val{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
  .foot{color:var(--muted);font-size:.72rem;text-align:center;margin-top:22px;line-height:1.5}
  .hidden{display:none !important}
  .trxbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:9px 12px;margin:-6px 0 14px;font-size:.8rem;color:var(--muted)}
  .trxbar.warn{border-color:#f0a02266;color:#f3c77a}.trxbar.bad{border-color:#e23b3b66;color:#f39b9b}
  .trxbar a{color:var(--accent);text-decoration:none;white-space:nowrap}
  .trxtoast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#e23b3b;color:#fff;
    padding:10px 16px;border-radius:12px;font-size:.84rem;z-index:30;box-shadow:0 6px 20px #0006;max-width:90vw;text-align:center}
  .footupd{display:inline-flex;align-items:center;gap:10px;margin-top:10px;padding:8px 10px 8px 14px;border:1px solid #2bb67366;
    background:#2bb67314;color:var(--fg);border-radius:999px;font-size:.8rem}
  .footupd button{background:#2bb673;color:#0b1017;border:none;border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:.78rem}
  .footupd small{color:var(--muted)}
  .flag{width:20px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:8px;box-shadow:0 0 0 1px #0003}
  .logbar{margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .logbar::-webkit-scrollbar{display:none}
  .seg.logbar button{flex:none;min-width:0;padding:9px 14px;border-radius:999px}
  #pg-more details.all>summary{display:none}
  .settabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px 16px;padding:0 2px 2px;-webkit-overflow-scrolling:touch}
  .settabs::-webkit-scrollbar{display:none}
  .settabs button{flex:none;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.84rem;cursor:pointer;white-space:nowrap}
  .settabs button[aria-selected="true"]{color:#0b1017;background:var(--accent);border-color:var(--accent);font-weight:600}
  #settings .sec.tabhide{display:none !important}
  .psearch{width:100%;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:.9rem;margin-bottom:12px}
  details.ptopic{border-top:1px solid var(--line)}
  details.ptopic:first-of-type{border-top:none}
  details.ptopic>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 2px;font-size:.9rem;font-weight:600}
  details.ptopic>summary::-webkit-details-marker{display:none}
  details.ptopic>summary small{color:var(--muted);font-weight:500;font-size:.74rem}
  details.ptopic>summary .chev{margin-left:auto;transition:.2s;color:var(--muted)}
  details.ptopic[open]>summary .chev{transform:rotate(180deg)}
  details.ptopic .psub{color:var(--muted);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;margin:6px 2px 0}
  .prow .k code{display:block;color:var(--muted);font-size:.66rem;margin-top:3px;font-family:ui-monospace,Menlo,monospace;opacity:.8}
  .logday{color:var(--muted);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;margin:16px 2px 4px}
  .logrow{display:flex;align-items:flex-start;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
  .logrow:last-child{border-bottom:none}
  .logrow .lt{width:42px;flex:none;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;padding-top:1px}
  .logrow .ld{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px;background:#9fb2d0}
  .logrow .ld.cmd{background:var(--accent)}.logrow .ld.fault{background:#e23b3b}.logrow .ld.warn{background:#f0a022}.logrow .ld.measure{background:#57c98a}
  .logrow .lx{flex:1;font-size:.86rem;line-height:1.4}
  .logrow .lx small{display:block;color:var(--muted);font-size:.74rem;margin-top:2px}
  .rmqr{background:#fff;border-radius:12px;padding:10px;margin:10px auto;width:220px;height:220px}
  .rmqr img{width:100%;height:100%;display:block}
  .rmlink{width:100%;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:.78rem}
  .rmb{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.84rem}
  .rmb:last-child{border-bottom:none}.rmb .nm{flex:1}.rmb small{color:var(--muted)}
  .rmb button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:3px 8px;cursor:pointer}

  /* settings */
  .settitle{font-family:"Space Grotesk";font-weight:600;font-size:1.2rem;margin:0}
  .sec{margin-bottom:22px}
  .sec>h2{font-size:.72rem;letter-spacing:.06em;color:var(--muted);margin:0 2px 10px;font-weight:600;text-transform:uppercase}
  .pillwrap{display:flex;flex-wrap:wrap;gap:8px}
  .pill{padding:10px 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-size:.86rem}
  .pill[aria-pressed="true"]{color:#0b1017;background:var(--accent);border-color:var(--accent);font-weight:600}
  .devcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
  .devcard .dh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .devcard .dh b{font-size:.95rem}
  .devcard .badge{font-size:.68rem;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 8px}
  .devcard .meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.8rem;color:var(--muted)}
  .devcard .meta span:nth-child(even){color:var(--fg);font-variant-numeric:tabular-nums;text-align:right}
  .info{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:.84rem;color:var(--muted);line-height:1.55}
  .info b{color:var(--fg)}
  #alerts{margin-bottom:18px}
  .alert{border-radius:12px;padding:12px 14px;font-size:.85rem;margin-bottom:8px;border:1px solid;display:flex;gap:8px;align-items:center}
  .alert::before{content:"";width:8px;height:8px;border-radius:50%;flex:none;background:currentColor}
  .alert.err{background:#3a1414;border-color:#5a1e1e;color:#ff9b9b}
  .alert.warn{background:#3a2e12;border-color:#5a481e;color:#ffcf7a}
  .alert-x{background:none;border:none;color:currentColor;opacity:.7;font-size:1.2rem;line-height:1;cursor:pointer;flex:none;padding:0 2px}
  .alert-x:hover{opacity:1}
  .barrow{margin-bottom:14px}
  .barrow:last-child{margin-bottom:0}
  .barrow .bl{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:6px}
  .barrow .bl .bv{color:var(--muted);font-variant-numeric:tabular-nums}
  .track2{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
  .fill2{height:100%;border-radius:999px;transition:width .4s ease}
  #timersBody .toggle{flex:none}
  #gasSection{margin-bottom:12px}
  .gasgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .gascard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px;text-align:center}
  .gastitle{font-size:.76rem;color:var(--muted);line-height:1.3;margin-bottom:10px;min-height:2.4em;display:flex;align-items:center;justify-content:center}
  .gasrow{display:flex;align-items:center;justify-content:center;gap:12px}
  .gasrow .bottle{width:38px;height:56px;color:var(--fg);flex:none}
  .gaspct{font-family:"Space Grotesk";font-weight:600;font-size:1.7rem;line-height:1}
  .gaskg{color:var(--muted);font-size:.92rem;margin-top:2px;font-variant-numeric:tabular-nums}
  .gasbar{height:6px;border-radius:999px;background:var(--surface2);margin-top:12px;overflow:hidden}
  .gasbar>div{height:100%;border-radius:999px;transition:width .4s ease}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;cursor:pointer;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s}
  .tile:active{background:var(--surface2)}
  .tile .th{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.8rem}
  .tile .th svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
  .tile.accent .th{color:var(--accent)}
  .tile .tv{font-family:"Space Grotesk";font-weight:600;font-size:1.5rem;line-height:1;margin-top:10px}
  .tile .ts{color:var(--muted);font-size:.78rem;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pagetitle{font-family:"Space Grotesk";font-weight:600;font-size:1.15rem;margin:2px 2px 14px}
  .spark{width:100%;height:46px;display:block;margin-top:10px}
  .gashist{margin-top:8px}
  .est{color:var(--muted);font-size:.76rem;text-align:center;margin-top:6px}
  #climateHistory{max-width:320px;margin:0 auto 8px}
  .trend{margin-top:6px}
  .taxis{display:flex;justify-content:space-between;gap:6px;color:var(--muted);font-size:.68rem;margin-top:5px}
  /* ---- responsive: phone = as designed; tablet / PC get more columns ---- */
  @media (min-width:720px){
    body{padding-left:24px;padding-right:24px}
    .wrap{max-width:780px}
    .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .tile{min-height:118px}
    .page.split:not(.hidden){display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,1.1fr);gap:0 28px;align-items:start}
    .page.split .pmain{position:sticky;top:16px}
    .page.split .pside{padding-top:18px}
    #settings:not(.hidden){column-count:2;column-gap:18px}
    #settings>.topbar,#settings>.settabs{column-span:all}
    #settings>.sec{break-inside:avoid;display:inline-block;width:100%}
    .trxbar{margin-top:-4px}
  }
  @media (min-width:1100px){
    .wrap{max-width:1120px}
    .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
    .dial{width:320px;height:320px}
    .temp{font-size:4.6rem}
    #settings:not(.hidden){column-count:3}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== MAIN ===== -->
  <div id="main">
    <div class="topbar">
      <button class="iconbtn hidden" id="back2" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="brand"><svg class="logo" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="10" width="4" height="11" rx="1"/><rect x="10" y="4" width="4" height="17" rx="1"/><rect x="17" y="13" width="4" height="8" rx="1"/></svg>truma&#8202;<small>·x</small></div>
      <div class="right">
        <div class="status" id="status"><span class="dot"></span><span id="statustext"></span></div>
        <button class="iconbtn" id="gear" aria-label="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 0 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 0 1 0-4h.1A1.6 1.6 0 0 0 2.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 7 2.6h.1A1.6 1.6 0 0 0 8 1.1V1a2 2 0 0 1 4 0v.1A1.6 1.6 0 0 0 15 2.6a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H23a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>

    <div id="trxBar" class="trxbar hidden"></div>
    <div id="alerts" style="display:none"></div>

    <div id="pageTitle" class="pagetitle hidden"></div>
    <div id="home"></div>

    <div class="page hidden split" id="pg-climate">
    <div class="pcol pmain">
    <div class="dial" id="dial">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <circle class="track" cx="120" cy="120" r="100" transform="rotate(135 120 120)" stroke-dasharray="471 628"></circle>
        <circle class="value" id="arc" cx="120" cy="120" r="100" transform="rotate(135 120 120)" stroke-dasharray="0 628"></circle>
        <circle class="curmark" id="curMark" cx="120" cy="20" r="6" style="opacity:0"></circle>
        <circle class="knob" id="knob" cx="120" cy="20" r="9"></circle>
      </svg>
      <div class="dial-center">
        <div class="temp"><span id="tgt">--</span><sup id="unit">&deg;C</sup></div>
        <div class="mode-name" id="modeName">--</div>
        <div class="cur" id="cur"></div>
      </div>
    </div>
    <div class="stepper">
      <button id="minus" aria-label="-">&minus;</button>

"use strict";

/* ---------------- remote mode (docs/remote-protocol.md) ----------------
   Opened from a link with #k=... (control) or #v=... (view-only), e.g. on GitHub Pages:
   every fetch("/api/...") then goes end-to-end encrypted over MQTT instead of HTTP.
   Opened from the ESP / bridge itself without such a link: plain local HTTP as before. */
const TRX_LOCAL_URL="http://truma-x.local/";
var TRX=(function(){          // var: the module script below reads window.TRX
  const hasKey=s=>/(^|&)(k|v)=/.test(s||"");
  const localHost=h=>!h||h==="localhost"||h.endsWith(".local")||h.startsWith("[")||
    /^(127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.)/.test(h);
  const hash=location.hash.slice(1); let link="";
  if(hasKey(hash)){ link=hash; try{ localStorage.setItem("trumax_link",hash); }catch(e){} }
  else if(!localHost(location.hostname)){ try{ link=localStorage.getItem("trumax_link")||""; }catch(e){} }
  if(!hasKey(link)) return null;
  const st={link, view:!/(^|&)k=/.test(link), client:null, status:{connected:false}, mismatch:0, error:""};
  st.ready=new Promise(r=>{ st._ready=r; });
  const realFetch=window.fetch.bind(window);
  window.fetch=async(u,o)=>(typeof u==="string"&&u.startsWith("/api/"))?(await st.ready).fetch(u,o):realFetch(u,o);
  st.isStale=()=>!st.client||st.client.isStale();
  return st;
})();
if(TRX) document.documentElement.classList.add("remote");

function renderTabs(){
  const tabs=[["general","tabGeneral"],["devices","tabDevices"],["conn","tabConn"],["notify","tabNotify"],["system","tabSystem"]];
  const secs=[...document.querySelectorAll("#settings .sec[data-tab]")];
  // a section hidden for its own reasons (remote mode, no display param…) doesn't count
  const visible=tab=>secs.some(x=>x.dataset.tab===tab&&!x.classList.contains("hidden"));
  const avail=tabs.filter(([id])=>visible(id)); if(!avail.some(([id])=>id===SET_TAB)&&avail.length) SET_TAB=avail[0][0];
  const bar=$("#setTabs"); bar.innerHTML="";
  for(const [id,k] of avail){ const b=document.createElement("button"); b.setAttribute("role","tab"); b.textContent=t(k);
    b.setAttribute("aria-selected",id===SET_TAB); b.onclick=()=>{ SET_TAB=id; try{localStorage.setItem("trumax_tab",id);}catch(e){} renderTabs(); window.scrollTo(0,0); };
    bar.appendChild(b); }
  for(const x of secs) x.classList.toggle("tabhide", x.dataset.tab!==SET_TAB);
}

function t(k,vars){ let s=L()[k]!=null?L()[k]:(T.en[k]!=null?T.en[k]:k);
  if(vars) for(const key in vars) s=s.replace("{"+key+"}",vars[key]); return s; }

/* ---------- formatting ---------- */
const isComma = ()=> CFG.lang!=="en";
function num1(x){ let s=x.toFixed(1); if(isComma()) s=s.replace(".",","); return s; }
function tempFrom(tenths){ const c=tenths/10; return CFG.unit==="F" ? c*9/5+32 : c; }
function unitStr(){ return CFG.unit==="F"?"°F":"°C"; }
function fmtTemp(tenths,withUnit){ const s=num1(tempFrom(tenths)); return withUnit? s+" "+unitStr() : s; }
function isTempParam(p){ return (p.topic&&(p.topic.startsWith("Air")||p.topic==="RoomClimate"||p.topic==="Temperature")) && /Temp/.test(p.param); }
function prettify(s){ return s.replace(/([a-z0-9])([A-Z])/g,"$1 $2").replace(/^./,c=>c.toUpperCase()); }

let _holdUntil=0; const _debounce={};
function postSoon(tn,pn,v,ms){ const k=tn+"."+pn; clearTimeout(_debounce[k]); _holdUntil=Date.now()+(ms||700)+3000;

function fetchT(url,opt,ms){ const c=new AbortController(); const tm=setTimeout(()=>c.abort(),ms||5000);

async function loadState(){
  try{
    const r=await fetchT("/api/state",{cache:"no-store",headers:authHeaders()},5000);
    if(r.status===401 && REAL){ showLogin(true); return null; }
    if(!r.ok) throw 0;
    const j=await r.json(); const params=j.params||j;
    if(j.bridge && j.bridge!=="connected" && _hadReal){ setStatus("bad","connecting"); return null; }   // bridge reconnecting: keep last values
    if(!params||!params.length) throw 0;
    _hadReal=true; _fails=0;
    if(TRX && TRX.isStale()) setStatus("bad","offline"); else setStatus("ok","connected");
    return {params, devices:j.devices||[], timers:j.timers||[]};
  }catch(e){
    // After real data was shown once, never swap in sample data: keep the last real values, show offline.
    if(_hadReal){ if(++_fails>=2) setStatus("bad","offline"); return null; }
    if(TRX){ setStatus("bad","connecting"); return null; }        // remote: wait for real data, no preview
    setStatus("mock","preview"); return {params:MOCK.params, devices:MOCK.devices, timers:MOCK.timers}; }
}

function normalize(params){
  const climate=pick(params,"RoomClimate","Mode"),tgt=pick(params,"RoomClimate","TgtTemp");

  const vent=pick(params,"AirCirculation","FanLevel");
  const fan=pick(params,"AirCooling","Mode");          // AC fan (Aventa); Combi ventilation = RoomClimate mode
  const heatMode=pick(params,"AirHeating","Mode");     // Combi Fast/Comfort, shown with heating
  const waterCur=pick(params,"WaterHeating","Temp"), waterOn=pick(params,"WaterHeating","Active");
  const water=pick(params,"WaterHeating","Mode"),gas=pick(params,"EnergySrc","GasLevel"),elec=pick(params,"EnergySrc","ElectricLevel");
  const lightA=pick(params,"AmbientLight","Active"),lightS=pick(params,"AmbientLight","LightStep");
  const alerts=params.filter(p=>/error|warning|fault|alert|frost/i.test(p.topic+p.param));
  const gasLevels=params.filter(p=>p.topic==="LevelControl" && /level|bottle/i.test(p.param) && !/active/i.test(p.param));
  const gasActive=pick(params,"LevelControl","ActiveBottle");
  const fresh=pick(params,"FreshWater","Level"),grey=pick(params,"GreyWater","Level");
  let batt=pick(params,"VBat","Voltage")||pick(params,"Battery","Voltage");
  if(!batt){ const e=pick(params,"Eol","Vcc12");   // panel's 12 V supply in mV -> tenths of a volt
    if(e&&e.value>0) batt=Object.assign({},e,{topic:"VBat",param:"Voltage",value:Math.round(e.value/100),writable:false,_src:e}); }
  const bright=pick(params,"Panel","Intst");

  alerts.forEach(p=>used.add(p)); gasLevels.forEach(p=>used.add(p)); if(gasActive)used.add(gasActive);
  return {params,climate,tgt,cur,fan,vent,heatMode,waterCur,waterOn,water,gas,elec,lightA,lightS,alerts,gasLevels,gasActive,fresh,grey,batt,bright,rest:params.filter(p=>!used.has(p))};
}

/* ---------- trend history + sparklines ---------- */
const HISTORY={};
async function loadHistory(key){
  try{ const r=await fetch("/api/history?key="+encodeURIComponent(key),{headers:authHeaders()});
    if(r.ok){ const j=await r.json(); if(j&&j.values&&j.values.length){ HISTORY[key]=j; return j.values; } } }catch(e){}
  HISTORY[key]=synthHistory(key); return HISTORY[key].values;   // preview / no data yet
}
function synthHistory(key){
  const p=key.split("."); let cur=50;
  const f=ST&&ST.params?ST.params.find(x=>x.topic===p[0]&&x.param===p[1]):null; if(f)cur=f.value;
  const n=48, vals=[];
  if(/Temp/.test(key)){ for(let i=0;i<n;i++) vals.push(Math.round(cur+Math.sin(i/4)*12)); }
  else { const start=Math.min(100,cur+35); for(let i=0;i<n;i++) vals.push(Math.round(start-(start-cur)*i/(n-1))); }
  return {interval:1800,values:vals};
}
function sparkSVG(vals,color){
  if(!vals||vals.length<2) return "";
  const mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=(mx-mn)||1,n=vals.length;
  const pts=vals.map((v,i)=>((i/(n-1))*100).toFixed(1)+","+(28-((v-mn)/rng)*24).toFixed(1)).join(" ");
  return '<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>';
}
function daysToEmpty(vals,interval){
  if(!vals||vals.length<3) return null;
  const first=vals[0], last=vals[vals.length-1], spanDays=(vals.length-1)*interval/86400, drop=first-last;
  if(drop<=0||spanDays<=0) return null;
  return last/(drop/spanDays);
}
function trendChart(vals,interval,color,fmt){
  if(!vals||vals.length<2) return "";
  const mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),hours=Math.round((vals.length-1)*interval/3600);
  return '<div class="trend">'+sparkSVG(vals,color)+'<div class="taxis"><span>-'+hours+' h</span><span>'+fmt(mn)+' – '+fmt(mx)+'</span><span>'+t("now")+'</span></div></div>';
}

function dragTo(ev){ if(!ST||!ST.climate||ST.climate.value===0)return; const box=$("#dial").getBoundingClientRect();
  const cx=box.left+box.width/2,cy=box.top+box.height/2,pt=ev.touches?ev.touches[0]:ev;
  let deg=Math.atan2(pt.clientY-cy,pt.clientX-cx)*180/Math.PI; deg=(deg+360)%360; let a=deg-135; if(a<0)a+=360; if(a>270)a=(a>315)?0:270;
  const m=ST.climate.value, vi=isVentMode(m)?ventInfo():null;
  if(vi){ const lv=Math.round(vi.min+a/270*(vi.max-vi.min)); ST.vent.value=lv; $("#tgt").textContent=String(lv); drawFrac((lv-vi.min)/Math.max(1,vi.max-vi.min)); return; }
  const t2=Math.round((16+a/270*14)*2)*5; if(ST.tgt){ST.tgt.value=t2;TGT=t2;$("#tgt").textContent=fmtTemp(t2,false);drawArc(t2);} }
(function(){ const d=$("#dial"); d.addEventListener("pointerdown",e=>{dragging=true;dragTo(e);e.preventDefault();}); window.addEventListener("pointermove",e=>{if(dragging)dragTo(e);}); window.addEventListener("pointerup",()=>{ if(!dragging) return; dragging=false;

/* boot */
let _lastState="", _lastSettings=0, _busy=false;
async function refresh(full){
  if(!full && Date.now()<_holdUntil) return;      // user is still adjusting: don't jump back
  if(_busy) return; _busy=true;
  try{
    if(full || Date.now()-_lastSettings>60000){ await loadSettings(); await loadUpdate(); await loadNetwork(); await loadBle(); await loadRemote(); await loadLog(true); _lastSettings=Date.now(); full=true; }
    const s=await loadState(); if(!s) return;
    if(!REAL){ try{ const lt=JSON.parse(localStorage.getItem("trumax_timers")||"null"); if(lt) s.timers=lt; }catch(e){} }
    const key=JSON.stringify(s);
    if(!full && key===_lastState) return;          // nothing changed: don't re-render (no flicker)
    _lastState=key;
    ST=normalize(s.params); ST.devices=s.devices; ST.timers=s.timers;
    if(full || !$("#settings").classList.contains("hidden")) renderAllViews(); else renderMain();
  } finally { _busy=false; }
}

const LOGB={ok:false,entries:[],kind:"all",more:false};

  "EnergySrc.GasLevel":"gas","EnergySrc.ElectricLevel":"electricLevel","EnergySrc.EnergySourcePrio":"energySource",
  "AirCirculation.FanLevel":"fan","AirHeating.Mode":"heatMode","AirCooling.Mode":"fan","Panel.Intst":"brightness",
  "AmbientLight.Active":"ambientLight","AmbientLight.LightStep":"ambientLight","System.Warning":"warning","System.Error":"error",
  "FreshWater.Level":"freshWater","GreyWater.Level":"greyWater","VBat.Voltage":"battery"};
function pLabel(tn,pn){ const k=PNAME[tn+"."+pn]; if(k) return t(k);
  const b=/^(Scale)?Bottle(\d)$/.exec(pn); if(tn==="LevelControl"&&b) return t("gasLevel")+" "+b[2];
  if(/Error|Warning|Fault/.test(pn)) return t(/Warning/.test(pn)?"warning":"error");
  return prettify(tn)+" · "+prettify(pn); }
function vLabel(e){ const v=e.v;
  if(e.pn==="TgtTemp") return fmtTemp(v,true);
  if(e.tn==="RoomClimate"&&e.pn==="Mode") return modeName(v)||(e.vn?tLevel(e.vn):String(v));
  if(e.pn==="FanLevel") return v+" / 10";
  if(e.pn==="Voltage") return num1(v/10)+" V";
  if(e.vn) return tLevel(e.vn);
  return String(v); }
function logTime(ts){ return new Date(ts*1000).toLocaleTimeString(CFG.lang,{hour:"2-digit",minute:"2-digit"}); }
function logDay(ts){ const d=new Date(ts*1000), n=new Date(); const k=x=>x.toDateString();
  if(k(d)===k(n)) return t("logToday"); const y=new Date(n); y.setDate(n.getDate()-1); if(k(d)===k(y)) return t("logYesterday");
  return d.toLocaleDateString(CFG.lang,{weekday:"long",day:"numeric",month:"long"}); }
function logText(e){
  const src={local:t("srcLocal"),remote:t("srcRemote"),panel:t("srcPanel")}[e.src]||"";
  switch(e.ev){
    case "set": return {main:pLabel(e.tn,e.pn)+" → "+vLabel(e), sub:[src,e.dev,e.ok===false?t("evFailed"):null].filter(Boolean).join(" · "), dot:e.ok===false?"fault":"cmd"};
    case "fault": return {main:pLabel(e.tn,e.pn)+": "+(e.vn?tLevel(e.vn):String(e.v)), sub:e.dev||"", dot:/Warning/.test(e.pn)?"warn":"fault"};
    case "fault_clear": return {main:t("evFaultClear",{p:pLabel(e.tn,e.pn)+(e.vn?" ("+tLevel(e.vn)+")":"")}), sub:e.dev||"", dot:"conn"};
    case "gas_low": return {main:t("evGasLow",{p:pLabel(e.tn,e.pn),v:e.v}), sub:e.dev||"", dot:"warn"};
    case "measure": { const b=[];
      if(e.temp!=null) b.push(fmtTemp(e.temp,true)); if(e.vbat!=null) b.push(num1(e.vbat/10)+" V");
      if(e.gas1!=null) b.push(t("gasLevel")+" "+e.gas1+(e.gas2!=null?" / "+e.gas2:"")+" %");
      if(e.fresh!=null) b.push(t("freshWater")+" "+e.fresh+" %"); if(e.grey!=null) b.push(t("greyWater")+" "+e.grey+" %");
      const sub=[e.mode!=null?modeName(e.mode):null, e.tgt!=null&&e.mode?t("targetTemp")+" "+fmtTemp(e.tgt,true):null].filter(Boolean).join(" · ");
      return {main:b.join(" · ")||"—", sub, dot:"measure"}; }
    case "ble_up": return {main:t("evBleUp"), sub:e.dev||"", dot:"conn"};
    case "ble_down": return {main:t("evBleDown"), sub:"", dot:"warn"};
    case "broker_up": return {main:t("evBrokerUp",{h:e.host||""}), sub:"", dot:"conn"};
    case "broker_down": return {main:t("evBrokerDown",{h:e.host||""}), sub:"", dot:"warn"};
    case "start": return {main:t("evStart"), sub:e.v||"", dot:"conn"};
    case "stop": return {main:t("evStop"), sub:"", dot:"conn"};
    case "remote_on": return {main:t("evRemoteOn"), sub:"", dot:"conn"};
    case "remote_off": return {main:t("evRemoteOff"), sub:"", dot:"conn"};
    case "newkey": return {main:t("evNewKey"), sub:"", dot:"warn"};

  return {main:e.ev, sub:"", dot:"conn"}; }

if(TRX){ setInterval(trxRender,5000);
  for(const id of ["#netSec","#bleSec","#fwSec","#secSec"]){ const e=$(id); if(e) e.classList.add("hidden"); }
  const bn=$("#bleNameInput"); if(bn&&bn.closest(".card")) bn.closest(".card").classList.add("hidden"); }

let RM={enabled:false,brokers:[],custom:"",link:"",viewLink:"",connected:false,broker:"",qr:false,known:{}}, RM_KIND="control", RM_LOADED=false;
async function loadRemote(){ if(TRX) return; try{ const r=await fetch("/api/remote",{cache:"no-store",headers:authHeaders()}); if(r.ok){ RM=await r.json(); RM_LOADED=true; } }catch(e){} }
async function saveRemote(patch,path){
  try{ const r=await fetch(path||"/api/remote",{method:"POST",headers:Object.assign({"Content-Type":"application/json"},authHeaders()),body:JSON.stringify(patch||{})});
    const j=await r.json(); if(r.ok) RM=j; else if(j.error) trxToastLocal(j.error); }catch(e){}
  renderRemote(); }
function trxToastLocal(m){ trxToast(m); }
function renderRemote(){
  $("#remoteHead").textContent=t("remote");
  if(TRX){
    $("#rmLocalCard").classList.add("hidden"); $("#rmRemoteCard").classList.remove("hidden");
    $("#rmRemoteInfo").innerHTML=t("rmRemoteInfo",{kind:t(TRX.view?"rmView":"rmControl"),local:TRX_LOCAL_URL.replace(/^http:\/\/|\/$/g,"")});
    const f=$("#rmForget"); f.textContent=t("rmForget");
    f.onclick=()=>{ try{ localStorage.removeItem("trumax_link"); }catch(e){} location.href=location.pathname; };
    return; }
  if(!RM_LOADED){ $("#rmSec").classList.add("hidden"); return; }
  $("#rmSec").classList.remove("hidden");
  $("#rmEnableLabel").textContent=t("rmEnable");
  const tg=$("#rmToggle"); tg.setAttribute("aria-pressed",!!RM.enabled); tg.onclick=()=>saveRemote({enabled:!RM.enabled});
  $("#rmState").textContent=!RM.enabled?t("rmOff"):(RM.connected?t("rmConnectedTo",{b:RM.broker}):t("rmConnecting"));
  $("#rmBody").classList.toggle("hidden",!RM.enabled);
  $("#rmNote").textContent=t("rmNote");
  if(!RM.enabled) return;
  const kw=$("#rmKind"); kw.innerHTML="";
  for(const [k,l] of [["control",t("rmControl")],["view",t("rmView")]]){ const b=document.createElement("button"); b.className="pill"; b.textContent=l;
    b.setAttribute("aria-pressed",k===RM_KIND); b.onclick=()=>{ RM_KIND=k; renderRemote(); }; kw.appendChild(b); }
  const link=RM_KIND==="view"?RM.viewLink:RM.link;
  $("#rmLink").value=link;
  const img=$("#rmQrImg"), qr=$("#rmQr");
  if(RM.qr){ qr.classList.remove("hidden"); const src="/api/remote/qr.svg?view="+(RM_KIND==="view"?1:0)+"&k="+encodeURIComponent(link.slice(-8));
    if(img.getAttribute("src")!==src) img.src=src; }
  else { qr.classList.add("hidden"); $("#rmState").textContent+=" "+t("rmNoQr"); }
  const cp=$("#rmCopy"); cp.textContent=t("rmCopy");
  cp.onclick=async()=>{ try{ await navigator.clipboard.writeText(link); }catch(e){ const i=$("#rmLink"); i.select(); document.execCommand("copy"); } cp.textContent=t("rmCopied"); setTimeout(()=>cp.textContent=t("rmCopy"),1500); };
  const sh=$("#rmShare"); sh.textContent=t("rmShare"); sh.classList.toggle("hidden",!navigator.share);
  sh.onclick=()=>navigator.share({title:"truma-x",url:link}).catch(()=>{});
  $("#rmBrokersLabel").textContent=t("rmBrokers");
  const bw=$("#rmBrokers"); bw.innerHTML="";
  const order=(RM.brokers||[]).filter(i=>i!=="custom"); const all=order.concat(Object.keys(RM.known||{}).filter(i=>!order.includes(i)));
  all.forEach((id,ix)=>{ const on=order.includes(id), url=RM.known[id]||"", port=(url.match(/:(\d+)\//)||[])[1]||"443";
    const row=document.createElement("div"); row.className="rmb";
    row.innerHTML='<input type="checkbox"'+(on?" checked":"")+'><span class="nm"></span><button aria-label="up">↑</button>';
    row.querySelector(".nm").textContent=trxHost(url)+(port!=="443"?"  ":"");
    if(port!=="443"){ const sm=document.createElement("small"); sm.textContent=" · "+t("rmNot443"); row.querySelector(".nm").appendChild(sm); }
    row.querySelector("input").onchange=(e)=>{ const n=e.target.checked?order.concat([id]):order.filter(x=>x!==id); if(n.length) saveRemote({brokers:n}); else renderRemote(); };
    const up=row.querySelector("button"); up.style.visibility=(on&&order.indexOf(id)>0)?"visible":"hidden";
    up.onclick=()=>{ const n=order.slice(), i=n.indexOf(id); [n[i-1],n[i]]=[n[i],n[i-1]]; saveRemote({brokers:n}); };
    bw.appendChild(row); });
  $("#rmCustomLabel").textContent=t("rmCustom");
  const ci=$("#rmCustom"); if(document.activeElement!==ci) ci.value=RM.custom||"";
  const warn=()=>{ const m=(ci.value.match(/^wss?:\/\/(?:[^@\/]*@)?[^:\/]+:(\d+)/)||[])[1]; const w=$("#rmPortWarn");
    w.textContent=t("rmPortWarn"); w.classList.toggle("hidden",!ci.value||!m||m==="443"); };
  warn(); ci.oninput=warn; ci.onchange=()=>saveRemote({custom:ci.value.trim()});
  const nb=$("#rmNew"); nb.textContent=t("rmNew");
  nb.onclick=()=>{ if(confirm(t("rmNewConfirm"))) saveRemote({}, "/api/remote/newkey"); };
}

<script type="module">
if (window.TRX) {
  const TRX = window.TRX;
  try {
    if (!globalThis.crypto || !crypto.subtle) throw new Error("no WebCrypto (needs https)");
    const { parseLink, RemoteClient } = await import("./truma_remote.js");   // only loaded in remote mode
    const { keys, brokers } = await parseLink(TRX.link);
    TRX.view = !keys.canCmd;
    TRX.client = new RemoteClient(keys, brokers, {
      onStatus: (s) => { TRX.status = s; trxRender(); },
      onState: () => { TRX.mismatch = 0; trxRender(); },
      onMismatch: (v) => { TRX.mismatch = v; trxRender(); },
    }).start();
    TRX._ready(TRX.client);
  } catch (e) {
    TRX.error = String(e && e.message || e);
    TRX._ready({ fetch: async () => { throw new TypeError("remote unavailable"); } });
  }
  trxRender();
}
</script>
